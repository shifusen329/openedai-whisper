version: "3.3"
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    environment:
      - HF_HOME=/app/hf_home
    env_file:
      - whisper.env
    ports:
      - "8000:8000"
    volumes:
      - /mnt/cache/huggingface:/app/hf_home
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']  # host GPU 1 = RTX A4000 (becomes index 0 inside container)
              capabilities: [gpu]
